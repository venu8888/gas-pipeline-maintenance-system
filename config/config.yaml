dataset:
  root: data
  yaml: data/dataset.yaml
model:
  name: yolov8n
  weights: yolov8n.pt
  image_size: 640
  confidence: 0.60
  iou: 0.50
training:
  epochs: 100
  image_size: 640
  batch_size: 16
  patience: 50
  pretrained: true
  seed: 42
  save_period: 0
  device: 0
  workers: 0
  cache: false
  amp: true
  resume: false
tracking:
  confirmation_frames: 3
  iou_threshold: 0.30
  max_age: 10
simulation:
  rover_speed_mps: 0.20
storage:
  root: inspection
  database: events.db
